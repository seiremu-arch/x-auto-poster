<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>消えた作家の部屋</title>
<style>
:root{
  --ink:#0e1116;
  --ink2:#161b23;
  --ink3:#1e242e;
  --line:#2c3542;
  --paper:#e8e2d6;
  --paper-dim:#a9a396;
  --accent:#c8503c;
  --accent2:#d8b26a;
  --ok:#6f9a7a;
  --serif:"Hiragino Mincho ProN","Yu Mincho",YuMincho,"Noto Serif JP",serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--ink);color:var(--paper);
  font-family:var(--serif);font-size:15px;line-height:1.9;
  -webkit-text-size-adjust:100%;
}
button{font-family:inherit;font-size:inherit;color:inherit}
.hide{display:none !important}

/* ---------- title ---------- */
#title{
  position:fixed;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:1.2rem;padding:2rem;
  background:
    radial-gradient(120% 90% at 50% 0%,#232a35 0%,#0e1116 62%),
    var(--ink);
  text-align:center;z-index:50;
}
#title .frame{
  border:1px solid var(--line);padding:2.4rem 2rem;max-width:560px;width:100%;
  background:rgba(14,17,22,.6);position:relative;
}
#title .frame::before{
  content:"";position:absolute;inset:6px;border:1px solid rgba(200,80,60,.28);pointer-events:none;
}
#title h1{
  margin:0 0 .4rem;font-size:clamp(28px,7vw,44px);letter-spacing:.22em;
  text-indent:.22em;font-weight:500;
}
#title .sub{color:var(--paper-dim);font-size:13px;letter-spacing:.3em;margin-bottom:1.6rem}
#title p.lead{color:var(--paper-dim);font-size:13.5px;text-align:left;margin:0 0 1.6rem}
.btn{
  background:transparent;border:1px solid var(--line);color:var(--paper);
  padding:.7rem 1.4rem;cursor:pointer;letter-spacing:.16em;transition:.18s;
}
.btn:hover{border-color:var(--accent);background:rgba(200,80,60,.10)}
.btn:disabled{opacity:.35;cursor:default}
.btn.primary{border-color:var(--accent);color:#f0d9d3}
.btn.small{padding:.35rem .7rem;font-size:12.5px;letter-spacing:.08em}

/* ---------- layout ---------- */
#app{display:flex;flex-direction:column;height:100%}
header{
  display:flex;align-items:center;gap:.8rem;padding:.55rem .9rem;
  border-bottom:1px solid var(--line);background:var(--ink2);flex-wrap:wrap;
}
header .ttl{letter-spacing:.2em;font-size:14px;white-space:nowrap}
header .day{color:var(--paper-dim);font-size:12px;letter-spacing:.1em}
header .spacer{flex:1}
header .count{font-size:12px;color:var(--paper-dim);letter-spacing:.08em}
main{flex:1;display:grid;grid-template-columns:190px 1fr 240px;min-height:0}
aside{background:var(--ink2);overflow-y:auto;padding:.7rem}
aside.left{border-right:1px solid var(--line)}
aside.right{border-left:1px solid var(--line)}
.panel-h{
  font-size:11.5px;letter-spacing:.24em;color:var(--paper-dim);
  border-bottom:1px solid var(--line);padding-bottom:.35rem;margin-bottom:.55rem;
}
.item{
  display:block;width:100%;text-align:left;background:transparent;border:0;
  border-left:2px solid transparent;padding:.34rem .5rem;cursor:pointer;
  font-size:13px;color:var(--paper);line-height:1.6;
}
.item:hover{background:var(--ink3)}
.item.active{border-left-color:var(--accent);color:#f2ded8;background:var(--ink3)}
.item.locked{color:#5b6472;cursor:default}
.item.locked:hover{background:transparent}
.item .who{display:block;font-size:11px;color:var(--accent2);letter-spacing:.06em}
.ev{
  display:block;width:100%;text-align:left;background:transparent;
  border:1px solid var(--line);padding:.32rem .5rem;margin-bottom:.35rem;
  font-size:12.5px;cursor:pointer;color:var(--paper);line-height:1.5;
}
.ev:hover{border-color:var(--accent2)}
.ev .id{color:var(--paper-dim);font-size:10.5px;letter-spacing:.1em;margin-right:.35rem}
.ev.new{border-color:var(--accent)}
.ev-empty{color:#5b6472;font-size:12px}

/* ---------- center ---------- */
#center{display:flex;flex-direction:column;min-width:0;min-height:0}
#scene{
  height:120px;flex:none;border-bottom:1px solid var(--line);position:relative;
  display:flex;align-items:flex-end;padding:.6rem .9rem;overflow:hidden;
}
#scene .name{
  position:relative;z-index:2;letter-spacing:.24em;font-size:15px;
  text-shadow:0 2px 10px rgba(0,0,0,.8);
}
#scene .art{position:absolute;inset:0;z-index:1}
#log{
  flex:1;overflow-y:auto;padding:1.1rem 1.1rem 1.4rem;min-height:0;
  background:linear-gradient(180deg,rgba(255,255,255,.015),transparent 120px);
}
#log .l{margin:0 0 .85rem;max-width:62ch}
#log .l.narr{color:#cfc9bc}
#log .l.say{color:var(--paper)}
#log .l.say b{color:var(--accent2);font-weight:500;display:block;font-size:13px;letter-spacing:.1em}
#log .l.sys{color:var(--ok);font-size:13px;border-left:2px solid var(--ok);padding-left:.7rem}
#log .l.q{color:#f0d9d3;border-left:2px solid var(--accent);padding-left:.7rem}
#log .sep{border:0;border-top:1px solid var(--line);margin:1.2rem 0}
#choices{
  flex:none;border-top:1px solid var(--line);background:var(--ink2);
  padding:.6rem .9rem;display:flex;flex-wrap:wrap;gap:.45rem;max-height:40vh;overflow-y:auto;
}
.choice{
  background:var(--ink3);border:1px solid var(--line);padding:.42rem .8rem;
  cursor:pointer;font-size:13px;transition:.15s;text-align:left;
}
.choice:hover{border-color:var(--accent);background:rgba(200,80,60,.10)}
.choice.done{color:#6d7684}
.choice.key{border-color:var(--accent2)}

/* ---------- modal ---------- */
#modal{
  position:fixed;inset:0;background:rgba(6,8,11,.82);z-index:60;
  display:flex;align-items:center;justify-content:center;padding:1.2rem;
}
#modal .box{
  background:var(--ink2);border:1px solid var(--line);max-width:520px;width:100%;
  padding:1.4rem;max-height:82vh;overflow-y:auto;
}
#modal h3{margin:0 0 .2rem;font-size:16px;letter-spacing:.1em}
#modal .tag{color:var(--paper-dim);font-size:11px;letter-spacing:.16em;margin-bottom:.9rem}
#modal p{margin:0 0 1rem;font-size:14px;color:#d9d3c6}
#modal .acts{display:flex;gap:.5rem;flex-wrap:wrap;justify-content:flex-end}

/* ---------- ending ---------- */
#ending{
  position:fixed;inset:0;z-index:70;overflow-y:auto;padding:3rem 1.2rem;
  background:radial-gradient(120% 80% at 50% 0%,#232a35 0%,#0b0d11 65%);
}
#ending .wrap{max-width:620px;margin:0 auto}
#ending .kind{letter-spacing:.34em;font-size:11.5px;color:var(--paper-dim)}
#ending h2{font-size:clamp(24px,6vw,34px);letter-spacing:.18em;margin:.3rem 0 1.6rem;font-weight:500}
#ending .body p{margin:0 0 1.1rem;color:#d5cfc2;font-size:14.5px}
#ending .verdict{border:1px solid var(--line);padding:1rem;margin:1.6rem 0;font-size:13px}
#ending .verdict div{display:flex;gap:.6rem;padding:.2rem 0;color:var(--paper-dim)}
#ending .verdict b{color:var(--paper);font-weight:500}
#ending .verdict .x{color:var(--accent)}
#ending .verdict .o{color:var(--ok)}

@media (max-width:860px){
  main{grid-template-columns:1fr;grid-template-rows:auto 1fr;overflow-y:auto}
  aside{display:none;max-height:44vh}
  aside.open{display:block}
  aside.left{border-right:0;border-bottom:1px solid var(--line)}
  aside.right{border-left:0;border-top:1px solid var(--line)}
  #scene{height:96px}
  #center{min-height:62vh}
  #choices{max-height:none}
}
.tabs{display:none;gap:.4rem}
@media (max-width:860px){ .tabs{display:flex} }
</style>
</head>
<body>

<div id="title">
  <div class="frame">
    <h1>消えた作家の部屋</h1>
    <div class="sub">THE VANISHED AUTHOR'S ROOM</div>
    <p class="lead">
      十二月二十四日の夜、作家・霧島遼は書斎「白の間」から消えた。<br>
      扉は内側から施錠されていた。床には血。遺体はない。<br>
      最新作の原稿から、最終章だけが抜け落ちていた。<br><br>
      あなたは彼の担当編集者。二十四時間で、<br>
      「誰が」「どうやって」「なぜ」を確かめなければならない。
    </p>
    <div style="display:flex;gap:.6rem;flex-wrap:wrap;justify-content:center">
      <button class="btn primary" id="btn-start">はじめから</button>
      <button class="btn" id="btn-continue">つづきから</button>
    </div>
  </div>
</div>

<div id="app" class="hide">
  <header>
    <span class="ttl">消えた作家の部屋</span>
    <span class="day">十二月二十五日</span>
    <span class="spacer"></span>
    <span class="count" id="count">証拠 0 / 15</span>
    <span class="tabs">
      <button class="btn small" id="tab-left">場所</button>
      <button class="btn small" id="tab-right">証拠</button>
    </span>
    <button class="btn small" id="btn-deduce">推理する</button>
    <button class="btn small" id="btn-title">中断</button>
  </header>
  <main>
    <aside class="left" id="pane-left">
      <div class="panel-h">白鷺館</div>
      <div id="places"></div>
    </aside>
    <section id="center">
      <div id="scene"><div class="art" id="art"></div><div class="name" id="scene-name"></div></div>
      <div id="log"></div>
      <div id="choices"></div>
    </section>
    <aside class="right" id="pane-right">
      <div class="panel-h">証拠</div>
      <div id="evidence"></div>
    </aside>
  </main>
</div>

<div id="modal" class="hide"><div class="box">
  <h3 id="m-title"></h3>
  <div class="tag" id="m-tag"></div>
  <p id="m-body"></p>
  <div class="acts" id="m-acts"></div>
</div></div>

<div id="ending" class="hide"><div class="wrap">
  <div class="kind" id="e-kind"></div>
  <h2 id="e-title"></h2>
  <div class="body" id="e-body"></div>
  <div class="verdict" id="e-verdict"></div>
  <div style="display:flex;gap:.6rem;flex-wrap:wrap">
    <button class="btn primary" id="e-retry">もう一度、あの部屋へ</button>
    <button class="btn" id="e-title-btn">タイトルへ</button>
  </div>
  <p style="color:#5b6472;font-size:12px;margin-top:2.4rem">
    『消えた作家の部屋』／ 原作・脚本・ゲームデザイン
  </p>
</div></div>

<script>
"use strict";

/* =========================================================
   『消えた作家の部屋』 data
   ========================================================= */

const EV = {
  E01:{n:"血の引きずり跡", w:"書斎", d:"床の血は扉ではなく、造り付けの書棚のほうへ細く伸びて消えている。何かを引きずった跡だ。運び出されたのなら、出口は扉ではない。"},
  E02:{n:"欠落した最終章", w:"書斎", d:"机上の原稿はノンブル231の次が245。最終章だけが抜けている。編集者の私にすら、まだ読ませてもらえていない章だ。"},
  E03:{n:"サムターンの擦り傷", w:"書斎", d:"内鍵のつまみに新しい擦り傷。針金や糸を使った施錠トリックを思わせる——が、傷はつまみの根元にしかない。"},
  E04:{n:"止まった掛け時計", w:"書斎", d:"落下して針が止まった掛け時計。二十一時十分。ガラスの割れ方からして、床に叩きつけられている。"},
  E05:{n:"ICレコーダー", w:"書斎", d:"霧島が口述筆記に使っていた機械。最後の再生履歴は二十二時四十分。だが録音日時は前日になっている。音声の背後で、風鈴が鳴っている。"},
  E06:{n:"黒いスパンコール", w:"廊下", d:"二重扉の内側に落ちていた黒い飾り。舞台衣装のような、安くはない仕立てのもの。"},
  E07:{n:"減っていない常用薬", w:"寝室", d:"三日前に処方された心臓の薬。一錠も減っていない。自分の意思で家を出た人間が、これを置いていくとは思えない。"},
  E08:{n:"新人賞の応募控え", w:"秘書室", d:"相馬千夏名義の、未発表原稿の応募控え。冒頭の三行を読んで、指が冷たくなった。この文体を、私は知っている。霧島遼の後期作品そのものだ。"},
  E09:{n:"改修工事の見積書と図面", w:"秘書室", d:"三年前の改修工事の書類。図面には、書斎の壁を貫いて地下まで抜ける旧配膳リフトの縦坑が描かれている。処理印は——相馬千夏。"},
  E10:{n:"霧島の日記", w:"図書室", d:"最後の頁。「次の一冊で終わりにする。彼女の“声”はもう要らない。私は私の声で死にたい」"},
  E11:{n:"燃え残った契約書", w:"応接間", d:"暖炉の灰の中に、厚い紙の切れ端。「……秘密保持……本契約に基づく著作の一切の権利は甲に帰属し……」署名欄は焼け落ちている。"},
  E12:{n:"配膳口の新しい木ネジ", w:"配膳室", d:"板で塞がれた古い配膳口。ネジだけが新しく、まだ光っている。ドライバーの噛み跡が、秘書室の工具箱のものと同じ形だ。"},
  E13:{n:"地下の血痕と万年筆", w:"地下", d:"縦坑の真下、ボイラーの脇の床に黒く乾いた血だまり。その縁に、霧島が二十年使い続けた万年筆が落ちている。ここまでは、確かに彼が来た。"},
  E14:{n:"漆喰のついたコート", w:"秘書室", d:"縦坑の壁の古い漆喰と、相馬千夏のコートの背中についた白い粉。同じものだ。背中——降りたのではない。背をつけて、壁を伝って降りたのだ。"},
  E15:{n:"足跡のない雪", w:"中庭", d:"昨夜二十時から雪。館の周囲に、外へ向かう足跡はひとつもない。出ていった者も、入ってきた者もいない。"}
};

const PEOPLE = {
  chinatsu:{name:"相馬 千夏", role:"専属秘書"},
  sakaki:{name:"榊 京介", role:"編集長"},
  mikoto:{name:"霧島 美琴", role:"義妹"},
  tokura:{name:"戸倉 秀一", role:"管理人"},
  rui:{name:"白瀬 累", role:"弟子"}
};

const PLACES = [
 {id:"shosai", name:"書斎「白の間」", art:"repeating-linear-gradient(90deg,rgba(255,255,255,.05) 0 2px,transparent 2px 26px),linear-gradient(180deg,#2a3240,#12161d 70%)",
  intro:[["narr","二重扉を抜けると、暖房の切れた部屋の匂いがした。紙とインクと、その下にうっすらと鉄の匂い。ここで、私の担当作家は消えた。"]],
  spots:[
   {id:"blood", label:"床の血痕を調べる", gives:"E01",
    lines:[["narr","血は乾ききっている。広がりの中心から、細い筋が一本だけ、壁際の書棚へ向かって伸びていた。誰かが、何かを引きずったのだ。"]]},
   {id:"genko", label:"机の上の原稿を読む", gives:"E02",

   {id:"lock", label:"扉の内鍵を確かめる", gives:"E03",

   {id:"clock", label:"落ちた掛け時計を拾う", gives:"E04",
    lines:[["narr","文字盤のガラスが砕け、針は二十一時十分で止まっている。壁から落ちたのではない。落とされたか、あるいは何かがぶつかったのだ。"]]},
   {id:"rec", label:"棚のICレコーダーを操作する", gives:"E05",
    lines:[["narr","霧島は口述で下書きをする癖があった。再生履歴の最後は昨夜二十二時四十分。"],["say:霧島 遼","——ここまでだ、千夏。もう休みなさい。"],["narr","録音日時の表示は、前日の午後。背後で、風鈴が鳴っている。昨夜は雪だった。風鈴は片づけられていたはずだ。"]]},
   {id:"shelf", label:"書棚の裏を検める", need:["E09"], sets:["shaft"],

  ]},
 {id:"rouka", name:"二重扉の廊下", art:"repeating-linear-gradient(0deg,rgba(255,255,255,.04) 0 1px,transparent 1px 18px),linear-gradient(180deg,#20262f,#0f1319 75%)",
  intro:[["narr","書斎の前は、防音のための二重扉。外側の扉と内側の扉のあいだに、人が一人立てるだけの空間がある。"]],
  spots:[
   {id:"spangle", label:"扉のあいだの床を見る", gives:"E06",
    lines:[["narr","黒い小さな飾りが落ちていた。スパンコール。館の誰かが、ここに立っていたということだ。"]]},
   {id:"listen", label:"防音の具合を確かめる", 
    lines:[["narr","内側の扉を閉めると、廊下の物音は完全に消えた。逆もまた同じだろう。ここで何が起きても、館の誰にも聞こえない。"]]}
  ]},
 {id:"shinshitsu", name:"霧島の寝室", art:"linear-gradient(180deg,#252a33,#101319 72%)",
  intro:[["narr","ベッドは整えられたまま。昨夜、彼はここへ戻ってきていない。"]],
  spots:[
   {id:"med", label:"枕元の薬を見る", gives:"E07",
    lines:[["narr","三日前に出たばかりの心臓の薬。一錠も減っていない。彼は毎晩これを飲まなければ眠れなかった。"]]},
   {id:"closet", label:"衣装棚を開ける",
    lines:[["narr","コートも鞄も靴も、欠けていない。旅立った人間の部屋ではない。"]]}
  ]},
 {id:"hishoshitsu", name:"秘書室", who:"chinatsu", art:"linear-gradient(90deg,rgba(216,178,106,.06),transparent 60%),linear-gradient(180deg,#2b2f39,#13161c 70%)",
  intro:[["narr","相馬千夏の部屋は、事件の翌朝だというのに、いつも通り整っていた。書類は角を揃えて重ねられている。"]],
  spots:[
   {id:"oubo", label:"棚の私物の書類を見る", need:["ghost"], gives:"E08",

   {id:"coat", label:"コート掛けを調べる", need:["plaster"], gives:"E14",

 {id:"toshoshitsu", name:"図書室", who:"mikoto", art:"repeating-linear-gradient(90deg,rgba(255,255,255,.045) 0 3px,transparent 3px 14px),linear-gradient(180deg,#2a2b33,#111318 74%)",
  intro:[["narr","天井まである書架。霧島遼の初版が並ぶ棚の前に、義妹の美琴が立っていた。"]],
  spots:[

const SAVE_KEY = "kieta-sakka-no-heya:v1";
const $ = id => document.getElementById(id);
const EV_IDS = Object.keys(EV);

let S = null;      // state
let mode = "explore";
let answers = [];
let qIndex = 0;

function newState(){
  return { place:"shosai", ev:[], flags:[], spots:[], topics:[], shown:[], visited:[] };
}
function save(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(S)); }catch(e){} }
function load(){ try{ return JSON.parse(localStorage.getItem(SAVE_KEY)||"null"); }catch(e){ return null; } }

const hasEv = id => S.ev.indexOf(id) >= 0;
const hasFlag = f => S.flags.indexOf(f) >= 0;
function meets(need){
  if(!need) return true;
  return need.every(n => /^E\d\d$/.test(n) ? hasEv(n) : hasFlag(n));
}
function place(id){ return PLACES.filter(p => p.id === id)[0]; }

/* ---------- log ---------- */
function push(kind, text){
  const p = document.createElement("p");
  if(kind === "narr"){ p.className = "l narr"; p.textContent = text; }
  else if(kind === "sys"){ p.className = "l sys"; p.textContent = text; }
  else if(kind === "q"){ p.className = "l q"; p.textContent = text; }
  else { // say:名前
    p.className = "l say";
    const b = document.createElement("b"); b.textContent = kind.slice(4);
    p.appendChild(b);
    p.appendChild(document.createTextNode("「" + text + "」"));
  }
  $("log").appendChild(p);
  $("log").scrollTop = $("log").scrollHeight;
}
function playLines(lines){ lines.forEach(l => push(l[0], l[1])); }
function sep(){ const h = document.createElement("hr"); h.className = "sep"; $("log").appendChild(h); }

/* ---------- gain ---------- */
function gainEv(id){
  if(hasEv(id)) return;
  S.ev.push(id);
  push("sys", "証拠を入手：" + EV[id].n);
  renderEvidence(); renderCount();
}
function setFlags(fs){ (fs||[]).forEach(f => { if(!hasFlag(f)) S.flags.push(f); }); }

/* ---------- render ---------- */
function renderCount(){
  $("count").textContent = "証拠 " + S.ev.length + " / " + EV_IDS.length;
  $("btn-deduce").disabled = S.ev.length < 10;
  $("btn-deduce").title = S.ev.length < 10 ? "証拠が10点集まると推理できる" : "推理を組み立てる";
}
function renderPlaces(){
  const box = $("places"); box.innerHTML = "";
  PLACES.forEach(p => {
    const b = document.createElement("button");
    const open = meets(p.need);
    b.className = "item" + (p.id === S.place ? " active" : "") + (open ? "" : " locked");
    b.innerHTML = "";
    b.appendChild(document.createTextNode(open ? p.name : "？？？"));
    if(open && p.who){
      const s = document.createElement("span"); s.className = "who";
      s.textContent = PEOPLE[p.who].name; b.appendChild(s);
    }
    if(open) b.onclick = () => { go(p.id); closePanes(); };
    box.appendChild(b);
  });
}
function renderEvidence(){
  const box = $("evidence"); box.innerHTML = "";
  if(!S.ev.length){
    const d = document.createElement("div");
    d.className = "ev-empty"; d.textContent = "まだ何も掴んでいない。";
    box.appendChild(d); return;
  }
  S.ev.slice().sort().forEach(id => {
    const b = document.createElement("button"); b.className = "ev";
    const s = document.createElement("span"); s.className = "id"; s.textContent = id;
    b.appendChild(s); b.appendChild(document.createTextNode(EV[id].n));
    b.onclick = () => openModal(EV[id].n, id + " ／ " + EV[id].w, EV[id].d);
    box.appendChild(b);
  });
}
function renderScene(){
  const p = place(S.place);
  $("scene-name").textContent = p.name;
  $("art").style.background = p.art;
}

/* ---------- choices ---------- */
function clearChoices(){ $("choices").innerHTML = ""; }
function addChoice(label, fn, cls){
  const b = document.createElement("button");
  b.className = "choice" + (cls ? " " + cls : "");
  b.textContent = label; b.onclick = fn;
  $("choices").appendChild(b);
  return b;
}
function renderChoices(){
  clearChoices();
  if(mode === "deduce") return;
  const p = place(S.place);
  (p.spots || []).forEach(sp => {
    if(!meets(sp.need)) return;
    const done = S.spots.indexOf(p.id + ":" + sp.id) >= 0;
    addChoice((done ? "・" : "") + sp.label, () => doSpot(p, sp), done ? "done" : (sp.gives ? "key" : ""));
  });
  if(p.who) addChoice(PEOPLE[p.who].name + "と話す", () => enterTalk(p.who));
}

function doSpot(p, sp){
  const key = p.id + ":" + sp.id;
  const first = S.spots.indexOf(key) < 0;
  if(first) S.spots.push(key);
  playLines(sp.lines);
  if(sp.gives) gainEv(sp.gives);
  if(sp.sets){ setFlags(sp.sets); renderPlaces(); }
  sep(); renderChoices(); save();
}

/* ---------- talk ---------- */
let talker = null;
function enterTalk(pid){
  talker = pid; mode = "talk";
  push("narr", PEOPLE[pid].name + "に向き直る。");
  renderTalk();
}
function renderTalk(){
  clearChoices();
  const t = TALK[talker];
  t.topics.forEach(tp => {
    if(!meets(tp.need)) return;
    const done = S.topics.indexOf(talker + ":" + tp.id) >= 0;
    addChoice((done ? "・" : "") + tp.label, () => doTopic(tp), done ? "done" : "");
  });
  if(S.ev.length) addChoice("証拠を突きつける", showPicker, "key");
  addChoice("話を切り上げる", () => { mode = "explore"; sep(); renderChoices(); });
}
function doTopic(tp){
  const key = talker + ":" + tp.id;
  if(S.topics.indexOf(key) < 0) S.topics.push(key);
  playLines(tp.lines);
  if(tp.gives) gainEv(tp.gives);
  if(tp.sets){ setFlags(tp.sets); renderPlaces(); renderChoices(); }
  renderTalk(); save();
}
function showPicker(){
  clearChoices();
  S.ev.forEach(id => {
    const used = S.shown.indexOf(talker + ":" + id) >= 0;
    addChoice((used ? "・" : "") + EV[id].n, () => doShow(id), used ? "done" : "");
  });
  addChoice("やめる", renderTalk);
}
function doShow(id){
  const key = talker + ":" + id;
  if(S.shown.indexOf(key) < 0) S.shown.push(key);
  push("narr", EV[id].n + "を差し出した。");
  const t = TALK[talker];
  const r = t.show[id];
  if(r){ playLines(r.lines); if(r.sets){ setFlags(r.sets); renderPlaces(); } }
  else playLines(t.def);
  renderTalk(); save();
}

/* ---------- move ---------- */
function go(id){
  const p = place(id);
  if(!meets(p.need)) return;
  S.place = id; mode = "explore"; talker = null;
  $("log").innerHTML = "";
  renderScene(); renderPlaces();
  playLines(p.intro);
  if(S.visited.indexOf(id) < 0) S.visited.push(id);
  renderChoices(); save();
}

/* ---------- modal ---------- */
function openModal(title, tag, body, acts){
  $("m-title").textContent = title;
  $("m-tag").textContent = tag || "";
  $("m-body").textContent = body;
  const box = $("m-acts"); box.innerHTML = "";
  (acts || [{t:"閉じる", f:closeModal}]).forEach(a => {
    const b = document.createElement("button");
    b.className = "btn small" + (a.p ? " primary" : "");
    b.textContent = a.t; b.onclick = a.f; box.appendChild(b);
  });
  $("modal").classList.remove("hide");
}
function closeModal(){ $("modal").classList.add("hide"); }

/* ---------- deduction ---------- */
function startDeduce(){
  if(S.ev.length < 10) return;
  openModal("推理を組み立てる", "ここから引き返せない",
    "集めた証拠で、事件の像を組み立てる。三つの問いに答えたら、その答えのまま結末が決まる。",
    [{t:"まだ調べる", f:closeModal}, {t:"組み立てる", p:true, f:() => { closeModal(); runDeduce(); }}]);
}
function runDeduce(){
  mode = "deduce"; answers = []; qIndex = 0;
  $("log").innerHTML = "";
  $("scene-name").textContent = "推理";
  $("art").style.background = "radial-gradient(60% 70% at 50% 100%,rgba(200,80,60,.30),transparent 60%),linear-gradient(180deg,#3a2a2a,#0c0e12 74%)";
  push("narr", "私は書斎の椅子に座り、集めたものを机の上に並べた。ここから先は、証拠ではなく、私の言葉の順番の問題だ。");
  askQ();
}
function askQ(){
  const q = DEDUCE[qIndex];
  sep(); push("q", "問" + (qIndex + 1) + "　" + q.q);
  clearChoices();
  q.opts.forEach((o, i) => addChoice(o.t, () => {
    answers.push(i);
    push("narr", "——" + o.t + "。");
    qIndex++;
    if(qIndex < DEDUCE.length) askQ(); else finish();
  }));
}
function finish(){
  const ok = DEDUCE.map((q, i) => q.opts[answers[i]].ok);
  let key;
  if(!ok[0]) key = "C";
  else if(ok[1] && ok[2]) key = "A";
  else key = "B";
  showEnding(key, ok);
  try{ localStorage.removeItem(SAVE_KEY); }catch(e){}
}
function showEnding(key, ok){
  const e = ENDINGS[key];
  $("e-kind").textContent = e.kind;
  $("e-title").textContent = e.title;
  const b = $("e-body"); b.innerHTML = "";
  e.body.forEach(t => { const p = document.createElement("p"); p.textContent = t; b.appendChild(p); });
  const v = $("e-verdict"); v.innerHTML = "";
  ["犯人", "方法", "動機"].forEach((label, i) => {
    const row = document.createElement("div");
    const mark = document.createElement("span");
    mark.className = ok[i] ? "o" : "x"; mark.textContent = ok[i] ? "○" : "×";
    const name = document.createElement("b"); name.textContent = label;
    const val = document.createElement("span"); val.textContent = DEDUCE[i].opts[answers[i]].t;
    row.appendChild(mark); row.appendChild(name); row.appendChild(val);
    v.appendChild(row);
  });
  const cnt = document.createElement("div");
  cnt.appendChild(document.createTextNode("集めた証拠　" + S.ev.length + " / " + EV_IDS.length));
  v.appendChild(cnt);
  $("ending").classList.remove("hide");
  $("ending").scrollTop = 0;
}

/* ---------- boot ---------- */
function startGame(state){
  S = state; mode = "explore";
  $("title").classList.add("hide");
  $("ending").classList.add("hide");
  $("app").classList.remove("hide");
  renderCount(); renderEvidence(); renderPlaces();
  go(S.place);
  if(S.ev.length === 0){
    push("sys", "場所を選び、調べ、人に話しかけ、証拠を集める。証拠が10点そろえば「推理する」が開く。");
  }
}
function toTitle(){
  $("app").classList.add("hide");
  $("ending").classList.add("hide");
  $("title").classList.remove("hide");
  $("btn-continue").disabled = !load();
}
function closePanes(){
  $("pane-left").classList.remove("open");
  $("pane-right").classList.remove("open");
}

$("btn-start").onclick = () => { try{ localStorage.removeItem(SAVE_KEY); }catch(e){} startGame(newState()); };
$("btn-continue").onclick = () => { const s = load(); if(s) startGame(s); };
$("btn-deduce").onclick = startDeduce;
$("btn-title").onclick = () => { save(); toTitle(); };
$("e-retry").onclick = () => startGame(newState());
$("e-title-btn").onclick = toTitle;
$("tab-left").onclick = () => { $("pane-right").classList.remove("open"); $("pane-left").classList.toggle("open"); };
$("tab-right").onclick = () => { $("pane-left").classList.remove("open"); $("pane-right").classList.toggle("open"); };
$("modal").onclick = e => { if(e.target.id === "modal") closeModal(); };

toTitle();
</script>
</body>
</html>
