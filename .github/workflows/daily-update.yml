name: Daily News Update

on:
  schedule:
    # 21:00 UTC = 06:00 JST (次の日)
    - cron: "0 21 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-news-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Capture into vault
        run: python scripts/loop.py capture --limit 5

      # ノートが増えたらObsidian用の図も作り直す(生成物なので毎回上書きしてよい)
      - name: Rebuild vault canvas
        run: python scripts/loop.py canvas

      - name: Review vault
        run: python scripts/loop.py review

      - name: Generate site
        run: python scripts/generate_site.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html vault
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update daily news and capture ($(date -u +%Y-%m-%d))"
            git push
          fi
