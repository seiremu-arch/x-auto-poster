name: Build Android App Bundle

# タイムボクシングの Android アプリ(AAB)をビルドして成果物として保存する。
# 手動実行: Actions タブ → このワークフロー → Run workflow
on:
  push:
    branches:
      - main
      - 'claude/**'
    paths:
      - 'android/**'
      - 'docs/timeboxing.html'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 21 を用意
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Android SDK パッケージを用意
        run: |
          set -eu
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle を用意
        uses: gradle/actions/setup-gradle@v4

      - name: 署名キーストアを配置(シークレットが設定されている場合のみ)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -eu
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload-keystore.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/upload-keystore.jks" >> "$GITHUB_ENV"
            echo "署名キーストアを配置しました。"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 が未設定です。未署名の AAB を出力します(Play Console にアップロードするには署名が必要)。"
          fi

      - name: AAB とテスト用 APK をビルド
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon printSigningStatus bundleRelease assembleDebug

      - name: 出力ファイルを表示
        run: |
          ls -lh android/app/build/outputs/bundle/release/
          ls -lh android/app/build/outputs/apk/debug/

      - name: AAB を保存
        uses: actions/upload-artifact@v4
        with:
          name: timeboxing-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: 動作確認用 APK を保存
        uses: actions/upload-artifact@v4
        with:
          name: timeboxing-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
