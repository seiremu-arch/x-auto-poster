name: Vault Review

on:
  push:
    paths:
      - "vault/**"
      - "books/**"
      - "scripts/loop.py"
      - "scripts/vault.py"
      - "scripts/build_book.py"
      - ".github/workflows/vault-review.yml"
  pull_request:
    paths:
      - "vault/**"
      - "books/**"
      - "scripts/loop.py"
      - "scripts/vault.py"
      - "scripts/build_book.py"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # スキーマ違反とリンク切れはエラー。滞留inboxなどの警告では落とさない。
      - name: Review vault
        run: python scripts/loop.py review

      # 図はノートから作り直せる生成物。ノートと食い違ったまま入ってきたら落とす。
      - name: Check vault canvas
        run: python scripts/loop.py canvas --check

      - name: Vault status
        run: python scripts/loop.py status

      # 作品の芯の一文が、PLAN・claimノート・MEMORY.md の3か所で一致しているか。
      # 片方だけ動くと、判断の置き場所の分担(claim 3f64e5ecd8)が静かに破れる。
      - name: Check books
        run: |
          for dir in books/*/; do
            [ -f "$dir/book.json" ] || continue
            python scripts/build_book.py "$(basename "$dir")" --check
          done
