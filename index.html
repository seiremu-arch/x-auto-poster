<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ぷにスケジュール</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="app-header">
      <h1>ぷにスケジュール</h1>
      <p class="tagline">
        今日から1年間、12週間+1週間（お休み週）のサイクルを繰り返す年間ビュー。
        余裕があるうちは丸くぷにぷに、予定が詰まるほど四角くカチコチに。
      </p>
    </header>

    <section class="global-settings">
      <label class="capacity-field">
        1日の使える時間
        <div class="capacity-input-row">
          <input type="number" id="dailyCapacityInput" min="60" max="1440" step="30" />
          <span>分</span>
        </div>
      </label>
    </section>

    <main id="viewRoot"></main>
  </div>

  <script src="app.js"></script>
</body>
</html>
